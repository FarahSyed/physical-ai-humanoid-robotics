<svg width="900" height="700" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: bold 24px sans-serif; fill: #333; }
    .subtitle { font: 18px sans-serif; fill: #666; }
    .component { font: 14px sans-serif; fill: white; }
    .label { font: 14px sans-serif; fill: #333; }
    .code { font: 12px monospace; fill: #333; }
    .box { fill: #E8F5E8; stroke: #4CAF50; stroke-width: 2; rx: 10; ry: 10; }
    .urdf-box { fill: #E3F2FD; stroke: #2196F3; stroke-width: 2; }
    .sdf-box { fill: #F3E5F5; stroke: #9C27B0; stroke-width: 2; }
    .arrow { stroke: #666; stroke-width: 2; marker-end: url(#arrowhead); }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
      refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" class="title">URDF vs SDF Comparison</text>
  <text x="450" y="70" text-anchor="middle" class="subtitle">Robot Description Formats for Humanoid Simulation</text>

  <!-- URDF Column -->
  <rect x="50" y="100" width="380" height="550" class="urdf-box"/>
  <text x="240" y="130" text-anchor="middle" class="label" font-weight="bold">URDF (Unified Robot Description Format)</text>

  <!-- URDF Features -->
  <text x="70" y="160" class="label" font-weight="bold">Primary Use:</text>
  <text x="70" y="180" class="label">• Robot description in ROS</text>
  <text x="70" y="200" class="label">• Kinematic chains</text>
  <text x="70" y="220" class="label">• Visual and collision properties</text>

  <text x="70" y="250" class="label" font-weight="bold">XML Root:</text>
  <text x="70" y="270" class="code">&lt;robot name="robot_name"&gt;</text>

  <text x="70" y="300" class="label" font-weight="bold">Key Elements:</text>
  <text x="70" y="320" class="label">• &lt;link&gt; - Rigid body components</text>
  <text x="70" y="340" class="label">• &lt;joint&gt; - Connections between links</text>
  <text x="70" y="360" class="label">• &lt;material&gt; - Visual appearance</text>
  <text x="70" y="380" class="label">• &lt;gazebo&gt; - Gazebo-specific extensions</text>

  <text x="70" y="410" class="label" font-weight="bold">Strengths:</text>
  <text x="70" y="430" class="label">• Simple and clean</text>
  <text x="70" y="450" class="label">• Strong ROS integration</text>
  <text x="70" y="470" class="label">• Extensive tooling support</text>

  <text x="70" y="500" class="label" font-weight="bold">Example Snippet:</text>
  <text x="70" y="520" class="code">&lt;link name="base_link"&gt;</text>
  <text x="70" y="540" class="code">  &lt;visual&gt;...&lt;/visual&gt;</text>
  <text x="70" y="560" class="code">  &lt;collision&gt;...&lt;/collision&gt;</text>
  <text x="70" y="580" class="code">  &lt;inertial&gt;...&lt;/inertial&gt;</text>
  <text x="70" y="600" class="code">&lt;/link&gt;</text>

  <!-- SDF Column -->
  <rect x="470" y="100" width="380" height="550" class="sdf-box"/>
  <text x="660" y="130" text-anchor="middle" class="label" font-weight="bold">SDF (Simulation Description Format)</text>

  <!-- SDF Features -->
  <text x="490" y="160" class="label" font-weight="bold">Primary Use:</text>
  <text x="490" y="180" class="label">• Native Gazebo format</text>
  <text x="490" y="200" class="label">• Simulation-specific features</text>
  <text x="490" y="220" class="label">• Physics, sensors, plugins</text>

  <text x="490" y="250" class="label" font-weight="bold">XML Root:</text>
  <text x="490" y="270" class="code">&lt;sdf version="1.7"&gt;</text>

  <text x="490" y="300" class="label" font-weight="bold">Key Elements:</text>
  <text x="490" y="320" class="label">• &lt;model&gt; - Robot or object</text>
  <text x="490" y="340" class="label">• &lt;link&gt; - Rigid body components</text>
  <text x="490" y="360" class="label">• &lt;joint&gt; - Connections between links</text>
  <text x="490" y="380" class="label">• &lt;sensor&gt; - Sensor definitions</text>

  <text x="490" y="410" class="label" font-weight="bold">Strengths:</text>
  <text x="490" y="430" class="label">• Native Gazebo support</text>
  <text x="490" y="450" class="label">• Detailed physics control</text>
  <text x="490" y="470" class="label">• Plugin architecture</text>

  <text x="490" y="500" class="label" font-weight="bold">Example Snippet:</text>
  <text x="490" y="520" class="code">&lt;model name="humanoid"&gt;</text>
  <text x="490" y="540" class="code">  &lt;link name="base_link"&gt;...&lt;/link&gt;</text>
  <text x="490" y="560" class="code">  &lt;joint name="joint1"&gt;...&lt;/joint&gt;</text>
  <text x="490" y="580" class="code">  &lt;plugin&gt;...&lt;/plugin&gt;</text>
  <text x="490" y="600" class="code">&lt;/model&gt;</text>

  <!-- Comparison Arrow -->
  <line x1="430" y1="350" x2="470" y2="350" class="arrow"/>
  <text x="450" y="340" text-anchor="middle" class="label" font-weight="bold">Conversion</text>
  <text x="450" y="360" text-anchor="middle" class="label">URDF ↔ SDF</text>

  <!-- Summary Box -->
  <rect x="200" y="670" width="500" height="80" class="box" fill-opacity="0.8"/>
  <text x="450" y="690" text-anchor="middle" class="label" font-weight="bold">Best Practices:</text>
  <text x="450" y="710" text-anchor="middle" class="label">• Use URDF for robot description and kinematics</text>
  <text x="450" y="730" text-anchor="middle" class="label">• Use SDF for simulation-specific features</text>
</svg>