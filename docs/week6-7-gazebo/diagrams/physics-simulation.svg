<svg width="900" height="700" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: bold 24px sans-serif; fill: #333; }
    .subtitle { font: 18px sans-serif; fill: #666; }
    .component { font: 14px sans-serif; fill: white; }
    .label { font: 14px sans-serif; fill: #333; }
    .param { font: 12px sans-serif; fill: #666; }
    .box { fill: #FFF3E0; stroke: #FF9800; stroke-width: 2; rx: 10; ry: 10; }
    .physics-box { fill: #E8F5E8; stroke: #4CAF50; stroke-width: 2; }
    .gravity-box { fill: #E3F2FD; stroke: #2196F3; stroke-width: 2; }
    .collision-box { fill: #F3E5F5; stroke: #9C27B0; stroke-width: 2; }
    .friction-box { fill: #FBE9E7; stroke: #FF5722; stroke-width: 2; }
    .arrow { stroke: #666; stroke-width: 2; marker-end: url(#arrowhead); }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
      refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" class="title">Physics Simulation in Gazebo</text>
  <text x="450" y="70" text-anchor="middle" class="subtitle">Humanoid Robotics Physics Parameters</text>

  <!-- Physics Engine Configuration -->
  <rect x="50" y="100" width="380" height="200" class="physics-box"/>
  <text x="240" y="130" text-anchor="middle" class="label" font-weight="bold">Physics Engine Configuration</text>

  <text x="70" y="160" class="label" font-weight="bold">Engine:</text>
  <text x="70" y="180" class="param">ODE (Open Dynamics Engine)</text>

  <text x="70" y="210" class="label" font-weight="bold">Time Step:</text>
  <text x="70" y="230" class="param">max_step_size: 0.001 seconds</text>

  <text x="70" y="250" class="label" font-weight="bold">Real-time Factor:</text>
  <text x="70" y="270" class="param">1.0 (real-time simulation)</text>

  <text x="70" y="290" class="label" font-weight="bold">Gravity:</text>
  <text x="70" y="310" class="param">9.8 m/s² (Earth standard)</text>

  <!-- Gravity Simulation -->
  <rect x="470" y="100" width="380" height="150" class="gravity-box"/>
  <text x="660" y="130" text-anchor="middle" class="label" font-weight="bold">Gravity Simulation</text>

  <text x="490" y="160" class="label" font-weight="bold">Direction:</text>
  <text x="490" y="180" class="param">0 0 -9.8 (downward)</text>

  <text x="490" y="210" class="label" font-weight="bold">Humanoid Impact:</text>
  <text x="490" y="230" class="param">• Affects balance and stability</text>
  <text x="490" y="250" class="param">• Influences walking gait</text>

  <!-- Collision Detection -->
  <rect x="50" y="330" width="380" height="180" class="collision-box"/>
  <text x="240" y="360" text-anchor="middle" class="label" font-weight="bold">Collision Detection</text>

  <text x="70" y="390" class="label" font-weight="bold">Contact Properties:</text>
  <text x="70" y="410" class="param">• Contact surface layer: 0.001m</text>
  <text x="70" y="430" class="param">• Max correcting velocity: 100.0</text>
  <text x="70" y="450" class="param">• Error Reduction Parameter: 0.2</text>

  <text x="70" y="470" class="label" font-weight="bold">Humanoid Application:</text>
  <text x="70" y="490" class="param">• Foot-ground contact</text>
  <text x="70" y="510" class="param">• Obstacle avoidance</text>

  <!-- Friction Properties -->
  <rect x="470" y="280" width="380" height="200" class="friction-box"/>
  <text x="660" y="310" text-anchor="middle" class="label" font-weight="bold">Friction Properties</text>

  <text x="490" y="340" class="label" font-weight="bold">Static Friction (μ):</text>
  <text x="490" y="360" class="param">• Typical range: 0.5 - 1.0</text>
  <text x="490" y="380" class="param">• High values: Stable footing</text>

  <text x="490" y="410" class="label" font-weight="bold">Dynamic Friction:</text>
  <text x="490" y="430" class="param">• Lower than static friction</text>
  <text x="490" y="450" class="param">• Affects sliding behavior</text>

  <text x="490" y="480" class="label" font-weight="bold">Humanoid Importance:</text>
  <text x="490" y="500" class="param">• Critical for balance control</text>
  <text x="490" y="520" class="param">• Affects walking stability</text>

  <!-- Physics Solver -->
  <rect x="200" y="540" width="500" height="120" class="box"/>
  <text x="450" y="570" text-anchor="middle" class="label" font-weight="bold">Physics Solver Parameters</text>

  <text x="220" y="600" class="label" font-weight="bold">ODE Solver:</text>
  <text x="220" y="620" class="param">• Type: Quick (iterative)</text>
  <text x="220" y="640" class="param">• Iterations: 10-20 for humanoid stability</text>
  <text x="220" y="660" class="param">• SOR factor: 1.3 for convergence</text>

  <!-- Arrows connecting concepts -->
  <line x1="240" y1="300" x2="660" y2="100" class="arrow"/>
  <line x1="430" y1="420" x2="470" y2="380" class="arrow"/>
  <line x1="240" y1="530" x2="450" y2="540" class="arrow"/>

  <!-- Humanoid Physics Annotation -->
  <circle cx="700" cy="600" r="40" fill="#FFEB3B" stroke="#FBC02D" stroke-width="2"/>
  <text x="700" y="605" text-anchor="middle" class="label" font-weight="bold">Humanoid</text>
  <text x="700" y="625" text-anchor="middle" class="param">Robot</text>

  <line x1="660" y1="500" x2="700" y2="560" class="arrow" stroke="#FF9800"/>
</svg>